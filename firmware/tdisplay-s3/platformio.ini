; BattleBuddy prototype for the LilyGO T-Display-S3 Touch (ESP32-S3, 1.9" 170x320 + CST816).

[env:tdisplay-s3]
platform = espressif32@7.1.3
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    symlink://../../core
    lovyan03/LovyanGFX@1.2.29
